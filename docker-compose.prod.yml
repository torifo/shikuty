services:
  web:
    build: ./apps/web
    container_name: shikuty-web
    restart: unless-stopped
    environment:
      - VIRTUAL_HOST=shikuty.opus.riumu.net
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=shikuty.opus.riumu.net
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    depends_on:
      - api
    networks:
      - global-proxy-network
      - internal

  api:
    build: ./apps/api
    container_name: shikuty-api
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - RAILS_ENV=production
      - RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - SHIKUTY_DATABASE_PASSWORD=${SHIKUTY_DATABASE_PASSWORD}
      - RAILS_LOG_TO_STDOUT=1
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  db:
    image: postgis/postgis:16-3.5
    container_name: shikuty-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: shikuty
      POSTGRES_PASSWORD: ${SHIKUTY_DATABASE_PASSWORD}
      POSTGRES_DB: shikuty_production
    volumes:
      - shikuty_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shikuty -d shikuty_production"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

volumes:
  shikuty_pgdata_prod:

networks:
  global-proxy-network:
    external: true
  internal:
    driver: bridge
